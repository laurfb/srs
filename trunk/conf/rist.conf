# RIST server configuration for SRS
# @see https://github.com/ossrs/srs/wiki

# Main server settings
listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

# RIST server configuration
rist_server {
    # Enable RIST server
    enabled         on;
    
    # RIST listening address and port
    # Format: [ip:]port or just port (binds to 0.0.0.0)
    listen          1971;
    
    # Maximum bandwidth in bps (bits per second)
    # Default: 15Mbps
    # Overwrite by env SRS_RIST_SERVER_MAXBW
    maxbw           15000000;
    
    # Buffer size in bytes
    # Default: 200KB
    # Overwrite by env SRS_RIST_SERVER_BUFFER
    buffer          200000;
    
    # Latency in milliseconds
    # Default: 120ms
    # Overwrite by env SRS_RIST_SERVER_LATENCY
    latency         120;
    
    # Connection timeout in milliseconds
    # When RIST connection costs more time than this, it will be closed
    # Default: 3000ms
    # Overwrite by env SRS_RIST_SERVER_CONNECT_TIMEOUT
    connect_timeout 3000;
    
    # Peer idle timeout in milliseconds
    # When RIST connection is idle more than this, it will be closed
    # Default: 10000ms
    # Overwrite by env SRS_RIST_SERVER_PEER_IDLE_TIMEOUT
    peer_idle_timeout 10000;
    
    # Enable packet drop when buffer is full
    # Default: on
    # Overwrite by env SRS_RIST_SERVER_PKT_DROP
    pkt_drop        on;
    
    # Default app name when streamid is not provided
    # Default: live
    # Overwrite by env SRS_RIST_SERVER_DEFAULT_APP
    default_app     live;
}

# Virtual host configuration
vhost __defaultVhost__ {
    # RIST-specific vhost configuration
    rist {
        # Enable RIST for this vhost
        enabled     on;
        
        # Convert RIST to RTMP automatically
        # When enabled, RIST streams can be played via RTMP/HLS/HTTP-FLV
        rist_to_rtmp on;
    }
    
    # HTTP remux for HLS/FLV delivery
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    
    # HLS configuration
    hls {
        enabled         on;
        hls_path        ./objs/nginx/html;
        hls_fragment    10;
        hls_window      60;
    }
    
    # HTTP callbacks (optional)
    http_hooks {
        enabled         off;
        on_connect      http://127.0.0.1:8085/api/v1/clients;
        on_close        http://127.0.0.1:8085/api/v1/clients;
        on_publish      http://127.0.0.1:8085/api/v1/streams;
        on_unpublish    http://127.0.0.1:8085/api/v1/streams;
        on_play         http://127.0.0.1:8085/api/v1/sessions;
        on_stop         http://127.0.0.1:8085/api/v1/sessions;
    }
}

# HTTP API configuration
http_api {
    enabled         on;
    listen          1985;
}

# HTTP Server for HLS delivery
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# Statistics configuration
stats {
    network         0;
    disk            sda;
}
